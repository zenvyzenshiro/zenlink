[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "ZenshiroDev/crates/zenlink-core",
    "ZenshiroDev/crates/zenlink-video",
    "ZenshiroDev/crates/zenlink-android",
    "ZenshiroDev/crates/zenlink-audio",
    "ZenshiroDev/crates/zenlink-apple",
    "ZenshiroDev/crates/zenlink-airplay",
]

[workspace.package]
version = "2.5.14"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Zenvy Zenshiro"]

[workspace.dependencies]
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["json"] }
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Test builds run like the real app: unoptimized pixel and packet loops cost a whole core.
# Test builds (build_portable_release.ps1 -Fast): all cores, thin LTO. Release stays strict.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
