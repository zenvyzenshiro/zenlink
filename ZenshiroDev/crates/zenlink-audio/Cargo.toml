[package]
name = "zenlink-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "ZenLink sound output: the v2.2.31 jitter buffer (portable) and a WASAPI backend."

# The buffer logic is portable std Rust. Only `wasapi.rs` is platform code
# (a thin backend behind one type; CoreAudio and
# PulseAudio/PipeWire backends come with the platform ports).
[dependencies]
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
]
