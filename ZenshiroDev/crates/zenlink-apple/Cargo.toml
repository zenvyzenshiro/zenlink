[package]
name = "zenlink-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Apple Driver mode in Rust on idevice: device list, Developer Disk Image, tunnel, screen stream."

[dependencies]
zenlink-core = { path = "../zenlink-core" }
log = { workspace = true }
base64 = "0.22"
gethostname = "1.1"
libloading = "0.8"
# Pinned: idevice breaks its API at every point release until 0.2.
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring",
    "amfi",
    "usbmuxd",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "display_stream",
    "mobile_image_mounter",
    "tss",
    "cryptexd",
    "remote_pairing",
    "springboardservices",
    "notification_proxy",
    "house_arrest",
    "installation_proxy",
] }
mdns-sd = "0.21.7"
plist = "1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "net", "io-util", "sync"] }
uuid = { version = "1", features = ["v3", "v4"] }
