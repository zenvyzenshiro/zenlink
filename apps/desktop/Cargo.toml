[package]
name = "zenlink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ZenLink"
path = "src/main.rs"

[dependencies]
zenlink-core = { path = "../../ZenshiroDev/crates/zenlink-core" }
zenlink-video = { path = "../../ZenshiroDev/crates/zenlink-video" }
zenlink-android = { path = "../../ZenshiroDev/crates/zenlink-android" }
zenlink-audio = { path = "../../ZenshiroDev/crates/zenlink-audio" }
zenlink-apple = { path = "../../ZenshiroDev/crates/zenlink-apple" }
zenlink-airplay = { path = "../../ZenshiroDev/crates/zenlink-airplay" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
serde_json = { workspace = true }
# Unzips the adb download (already in the tree through Slint's png).
miniz_oxide = "0.9"
log = { workspace = true }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030", "raw-window-handle-06"] }
qrcodegen = "1.8"
# Decodes the DPAPI-sealed passcode (already in the tree through zenlink-apple).
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_Storage_Packaging_Appx", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections"]

[build-dependencies]
slint-build = "1.18"
miniz_oxide = "0.9"

[features]
# Portable.exe: the native DLLs packed into ZenLink.exe. adb is not packed:
# ZenLink downloads it on request.
portable = []
